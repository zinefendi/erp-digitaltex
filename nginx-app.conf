server {
    listen 80;
    listen [::]:80;
    server_name app.vethypro.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.vethypro.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/app.vethypro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vethypro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Contrôle de session interne (Nginx → API)
    location = /_verifier_session {
        internal;
        proxy_pass http://api:3000/api/auth/verifier;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Catalogue du studio : servi par l'API, filtré selon les droits (prix)
    location = /studio/catalogue.json {
        proxy_pass http://api:3000/api/infographie/catalogue-brut;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Studio 3D : réservé aux utilisateurs connectés
    location /studio/ {
        auth_request /_verifier_session;
        error_page 401 = @connexion;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        # Types propres au Studio 3D (absents de mime.types)
        location ~* \.mjs$ { types { } default_type text/javascript; }
        location ~* \.glb$ { types { } default_type model/gltf-binary; }
    }
    location @connexion { return 302 /; }

    # Application Windows « ERP Uniform Studio » : installateur et fichier de mise à jour (public, sans liste)
    location ^~ /telechargements/ {
        root /usr/share/nginx;
        index index.html;
        autoindex off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        location ~* \.exe$ { types { } default_type application/vnd.microsoft.portable-executable; add_header Content-Disposition "attachment" always; add_header X-Content-Type-Options nosniff always; add_header Strict-Transport-Security "max-age=31536000" always; }
        location = /telechargements/latest.json { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; add_header Strict-Transport-Security "max-age=31536000" always; }
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
